name: Build IP PING PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IP-PING-PRO-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q IP-PING-PRO-source.zip -d .
          test -f IP-PING-PRO/app/build.gradle

      - name: Build debug APK
        working-directory: IP-PING-PRO
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IP-PING-PRO-APK
          path: IP-PING-PRO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
