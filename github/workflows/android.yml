
name: Build IP PING PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q IP-PING-PRO-source.zip -d .
          test -f IP-PING-PRO/app/build.gradle

      - name: Build APK
        working-directory: IP-PING-PRO
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: IP-PING-PRO-APK
          path: IP-PING-PRO/app/build/outputs/apk/debug/app-debug.apk
